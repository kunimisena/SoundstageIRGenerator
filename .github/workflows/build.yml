name: Windows build and core checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the current stable version after checks pass
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      assertions: ${{ steps.checks.outputs.assertions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, validate and publish without FFmpeg
        id: checks
        shell: pwsh
        run: |
          ./build.ps1
          $app = Join-Path $PWD 'publish/SoundstageIRGenerator/SoundstageIRGenerator.exe'
          $report = Join-Path $PWD 'artifacts/language'
          $check = Start-Process -FilePath $app -ArgumentList @('--language-check', ('"' + $report + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Bilingual validation failed' }
          $speakerApp = Join-Path $PWD 'publish/SoundstageIRGenerator/SoundstageSpeakers.exe'
          $speakerReport = Join-Path $PWD 'artifacts/speaker-ui/results.txt'
          $speakerCheck = Start-Process -FilePath $speakerApp -ArgumentList @('--check', ('"' + $speakerReport + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($speakerCheck.ExitCode -ne 0) { throw 'Speaker UI validation failed' }
          $count = 0
          Get-ChildItem artifacts -Recurse -Filter '*results.txt' | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            if ($text -match 'PASS (\d+) assertions') { $count += [int]$Matches[1] }
          }
          "assertions=$count" >> $env:GITHUB_OUTPUT
          "Core validation: $count assertions passed." >> $env:GITHUB_STEP_SUMMARY
  release:
    needs: windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check versioned release request
        id: request
        shell: pwsh
        env:
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(git diff --name-only HEAD^ HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare release version' }
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ((($changed -contains 'Directory.Build.props') -or $env:MANUAL_RELEASE -eq 'true') -and $version -match '^\d+\.\d+\.\d+$' -and (Test-Path "docs/releases/$version.md")) {
            "version=$version" >> $env:GITHUB_OUTPUT
            'publish=true' >> $env:GITHUB_OUTPUT
          }
      - uses: actions/setup-dotnet@v4
        if: steps.request.outputs.publish == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Package from clean source
        if: steps.request.outputs.publish == 'true'
        shell: pwsh
        run: ./tools/package.ps1
      - name: Publish version and leave commit comment
        if: steps.request.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
          CHECK_COUNT: ${{ needs.windows.outputs.assertions }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $assets = @("publish/packages/SoundstageIRGenerator-$version-win-x64.zip", "publish/packages/SoundstageIRGenerator-$version-source.zip", 'publish/packages/SHA256SUMS.txt')
          gh release create $tag @assets --draft --target $env:GITHUB_SHA --title "Soundstage IR Generator $version" --notes-file "docs/releases/$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
          $notes = Get-Content "docs/releases/$version.md" -Raw
          $body = "已发布 / Published $version. Windows Release build and $env:CHECK_COUNT core assertions passed.`n`nRelease: $url`n`n$notes"
          @{body=$body} | ConvertTo-Json | Set-Content artifacts/release-comment.json -Encoding utf8
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" --input artifacts/release-comment.json
          if ($LASTEXITCODE -ne 0) { throw 'Release published, but commit comment failed' }
          "Published [$tag]($url) with three verified build assets." >> $env:GITHUB_STEP_SUMMARY
